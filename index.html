<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ALFRED</title>
    <meta name="description" content="ALFRED — a personal butler for one." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Spline+Sans+Mono:wght@400;500;600&display=swap"
    />
    <script>
      // Paint the owner's ground before React mounts — no flash, no layout shift.
      try {
        var g = localStorage.getItem('alfred-ground');
        if (g && g !== 'ink') document.documentElement.setAttribute('data-ground', g);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
